name: Diagnose staff card white screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-staff-white-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Extract staff-card browser script
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('server.ts').read_text(encoding='utf-8')
          a=s.index('function staffCardPage')
          b=s.index('function surveyPage',a)
          p=s[a:b]
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',p)
          if not scripts:
              raise SystemExit('NO_STAFF_INLINE_SCRIPT')
          for i,script in enumerate(scripts):
              Path(f'/tmp/staff-inline-{i}.js').write_text(script,encoding='utf-8')
          print('STAFF_INLINE_SCRIPTS='+str(len(scripts)))
      - name: Report exact browser syntax error
        shell: bash
        run: |
          set +e
          failed=0
          for f in /tmp/staff-inline-*.js; do
            node --check "$f" >/tmp/node-check.out 2>/tmp/node-check.err
            rc=$?
            if [ $rc -ne 0 ]; then
              failed=1
              echo "FILE=$f"
              cat /tmp/node-check.err | tail -n 12
            fi
          done
          exit $failed
