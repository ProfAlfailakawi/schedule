name: Diagnose staff card white screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-staff-white-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Render staff-card browser script
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('server.ts').read_text(encoding='utf-8')
          a=s.index('function staffCardPage')
          b=s.index('function surveyPage',a)
          p=s[a:b]
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',p)
          if len(scripts) != 1:
              raise SystemExit(f'EXPECTED_ONE_STAFF_INLINE_SCRIPT_GOT_{len(scripts)}')
          script=scripts[0].replace('${JSON.stringify(token)}','"diagnostic-token"')
          remains=list(re.finditer(r'\$\{',script))
          if remains:
              print('UNRESOLVED_TEMPLATE_EXPRESSIONS='+str(len(remains)))
              for m in remains[:20]:
                  print(script[max(0,m.start()-80):m.start()+160].replace('\n',' '))
              raise SystemExit(2)
          Path('/tmp/staff-inline-rendered.js').write_text(script,encoding='utf-8')
          print('STAFF_INLINE_BYTES='+str(len(script.encode('utf-8'))))
      - name: Parse rendered browser script
        shell: bash
        run: node --check /tmp/staff-inline-rendered.js
