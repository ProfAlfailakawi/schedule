name: Repair instructor request page

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-staff-white-screen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Patch the real browser syntax defect
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text(encoding='utf-8')
          bad='excuse:it.excuse}})})})})'
          good='excuse:it.excuse}})})})'
          count=s.count(bad)
          if count != 1:
              raise SystemExit(f'expected exactly one broken request serialization tail, found {count}')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
      - name: Add permanent rendered-browser regression
        shell: bash
        run: |
          cat > tests/request-page-browser-syntax-audit.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const server = fs.readFileSync('server.ts', 'utf8');
          const start = server.indexOf('function instructorRequestPage');
          const end = server.indexOf('app.post("/api/public/request/:token/check"', start);
          if (start < 0 || end <= start) throw new Error('تعذر عزل صفحة طلب الأستاذ من المصدر');
          let fn = server.slice(start, end);
          fn = fn.replace(
            'function instructorRequestPage(token: string, nonce: string): string {',
            'function instructorRequestPage(token, nonce) {'
          );
          const sandbox = { html: '' };
          vm.runInNewContext(`${fn}\nhtml=instructorRequestPage('browser-test-token','nonce123');`, sandbox, { timeout: 1000 });
          const scripts = [...String(sandbox.html).matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (scripts.length !== 1) throw new Error(`توقعت سكربت متصفح واحداً في صفحة الأستاذ، ووجدت ${scripts.length}`);
          new vm.Script(scripts[0], { filename: 'instructor-request-inline.js' });
          console.log('✓ صفحة طلب الأستاذ المولدة تحمل JavaScript صالحاً للمتصفح');
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts['test:request-browser-syntax']='node tests/request-page-browser-syntax-audit.mjs';
          const needle='npm run test:instructor-request-server';
          if(!p.scripts.test.includes('npm run test:request-browser-syntax')){
            if(!p.scripts.test.includes(needle)) throw new Error('test chain anchor missing');
            p.scripts.test=p.scripts.test.replace(needle, needle+' && npm run test:request-browser-syntax');
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Browser page regression
        run: npm run test:request-browser-syntax
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts package.json tests/request-page-browser-syntax-audit.mjs
          git diff --cached --check
          git commit -m "fix(instructor-request): restore request page browser execution"
          git push origin HEAD:main
