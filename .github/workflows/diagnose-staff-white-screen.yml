name: Diagnose instructor request white screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-staff-white-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install runner dependencies
        run: npm ci --ignore-scripts
      - name: Render actual instructor request page
        shell: python
        run: |
          from pathlib import Path
          s=Path('server.ts').read_text(encoding='utf-8')
          a=s.index('function instructorRequestPage')
          b=s.index('app.get("/r/:token"',a)
          fn=s[a:b]
          Path('/tmp/render-request.ts').write_text("import fs from 'fs';\n"+fn+"\nfs.writeFileSync('/tmp/request.html', instructorRequestPage('diagnostic-token','nonce123'));\n",encoding='utf-8')
      - name: Execute page renderer
        run: npx tsx /tmp/render-request.ts
      - name: Extract rendered inline script
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path('/tmp/request.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html)
          if len(scripts)!=1: raise SystemExit(f'EXPECTED_ONE_SCRIPT_GOT_{len(scripts)}')
          Path('/tmp/request-rendered.js').write_text(scripts[0],encoding='utf-8')
          print('RENDERED_SCRIPT_BYTES='+str(len(scripts[0].encode('utf-8'))))
      - name: Parse actual rendered browser script
        run: node --check /tmp/request-rendered.js
