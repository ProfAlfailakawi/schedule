name: Apply institution-wide staff card fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-staff-card.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply institution-wide staff-card repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          p = Path('server.ts')
          text = p.read_text(encoding='utf-8')

          card_start = text.index('async function buildStaffCard')
          card_end = text.index('app.get("/api/share"', card_start)
          card = text[card_start:card_end]

          def one(src, old, new, label):
              n = src.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 literal match, found {n}')
              return src.replace(old, new, 1)

          def one_re(src, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, src, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {n}')
              return out

          # The staff link is the permission door; after civil-ID identity succeeds,
          # the personal card follows the instructor across the whole institution.
          card = one(card,
              'Repository.getSchedulesByScope({ collegeId: link.AdCollegeId, termId: link.AdTermId })',
              'Repository.getSchedulesByScope({ termId: link.AdTermId })',
              'current-term institution-wide lookup')
          card = one(card,
              'Repository.getSchedulesByScope({ collegeId: link.AdCollegeId, termId: displayTermId })',
              'Repository.getSchedulesByScope({ termId: displayTermId })',
              'selected-term institution-wide lookup')

          request_pattern = re.compile(r'''  const requestSectionIds = \[\.\.\.new Set\(rows\.map\(row => Number\(row\.AdSectionId \|\| 0\)\)\.filter\(Boolean\)\)\];\n  const requestLists = await Promise\.all\(requestSectionIds\.map\(sectionId =>\n    Repository\.getInstructorRequests\(Number\(link\.AdCollegeId\), sectionId, Number\(displayTermId\)\)\n  \)\);''')
          request_repl = '''  // Every request remains attached to the lecture's real college + section.
          // A link issued by one campus must never hide requests from another campus.
          const requestScopeMap = new Map<string, { collegeId: number; sectionId: number }>();
          for (const row of rows) {
            const collegeId = Number(row.AdCollegeId || 0), sectionId = Number(row.AdSectionId || 0);
            if (collegeId && sectionId) requestScopeMap.set(`${collegeId}:${sectionId}`, { collegeId, sectionId });
          }
          const requestLists = await Promise.all([...requestScopeMap.values()].map(scope =>
            Repository.getInstructorRequests(scope.collegeId, scope.sectionId, Number(displayTermId))
          ));'''
          card, n = request_pattern.subn(textwrap.dedent(request_repl).rstrip(), card, count=1)
          if n != 1:
              raise SystemExit(f'request scopes: expected 1 match, found {n}')

          movement_pattern = re.compile(r'''  const movementSections = \[\.\.\.new Set\(rows\.map\(row => Number\(row\.AdSectionId \|\| 0\)\)\.filter\(Boolean\)\)\];(?P<middle>.*?)  for \(const sectionId of movementSections\) \{\n    const versions = await Repository\.getScheduleVersions\(Number\(link\.AdCollegeId\), sectionId, Number\(displayTermId\), 30\);\n    const ordered = \[\.\.\.versions\]\.sort\(\(a,b\) => Date\.parse\(a\.createdAt\)-Date\.parse\(b\.createdAt\)\);\n    const liveSection = rows\.filter\(row => Number\(row\.AdSectionId\) === sectionId\);''', re.S)
          m = movement_pattern.search(card)
          if not m:
              raise SystemExit('movement scopes: source block not found')
          movement_repl = '''  const movementScopeMap = new Map<string, { collegeId: number; sectionId: number }>();
          for (const row of rows) {
            const collegeId = Number(row.AdCollegeId || 0), sectionId = Number(row.AdSectionId || 0);
            if (collegeId && sectionId) movementScopeMap.set(`${collegeId}:${sectionId}`, { collegeId, sectionId });
          }
          ''' + m.group('middle') + '''  for (const scope of movementScopeMap.values()) {
            const versions = await Repository.getScheduleVersions(scope.collegeId, scope.sectionId, Number(displayTermId), 30);
            const ordered = [...versions].sort((a,b) => Date.parse(a.createdAt)-Date.parse(b.createdAt));
            const liveSection = rows.filter(row => Number(row.AdCollegeId) === scope.collegeId && Number(row.AdSectionId) === scope.sectionId);'''
          card = card[:m.start()] + movement_repl + card[m.end():]

          # Carry the real teaching location with every lecture so a merged card stays clear.
          card = one(card,
              '      section: row.SCode || "",\n      start: row.fstarttime, end: row.fendtime,',
              '      section: row.SCode || "",\n      college: colleges.find(item => Number(item.AdCollegeId) === Number(row.AdCollegeId))?.AdCollegeName || "",\n      department: sections.find(item => Number(item.AdSectionId) === Number(row.AdSectionId))?.AdSectionName || "",\n      start: row.fstarttime, end: row.fendtime,',
              'lecture location metadata')

          card = one(card,
              '  return {\n    name: person.AdInstructorName || "",\n    college: colleges.find(row => row.AdCollegeId === link.AdCollegeId)?.AdCollegeName || "",',
              '  const teachingColleges = [...new Set(shaped.map(row => row.college).filter(Boolean))];\n\n  return {\n    name: person.AdInstructorName || "",\n    college: teachingColleges.length > 1 ? "كل مواقعك" : (teachingColleges[0] || colleges.find(row => row.AdCollegeId === link.AdCollegeId)?.AdCollegeName || ""),\n    colleges: teachingColleges,',
              'merged-card header scope')

          text = text[:card_start] + card + text[card_end:]

          # Personal ICS must follow the same person-wide rule as the visible card.
          cal_start = text.index('app.get("/api/public/ics/:token/:key"')
          cal_end = text.index('const STAFF_NOTES_PER_DAY', cal_start)
          cal = text[cal_start:cal_end]
          cal = one(cal,
              '  const [instructors, courses, terms] = await Promise.all([\n    Repository.getInstructors(), Repository.getCourses(), Repository.getTerms(),\n  ]);',
              '  const [instructors, courses, terms, colleges] = await Promise.all([\n    Repository.getInstructors(), Repository.getCourses(), Repository.getTerms(), Repository.getColleges(),\n  ]);',
              'calendar college references')
          cal = one_re(cal,
              r'''  const collegeRows = await Repository\.getSchedulesByScope\(\{\n    collegeId: resolved\.link\.AdCollegeId, termId: liveTermId,\n  \}\);\n  const rows = collegeRows\.filter\(row => row\.AdInstructorId === person\.AdInstructorId\);\n  const courseById = new Map\(courses\.map\(row => \[row\.AdCourseId, row\]\)\);''',
              '''  const termRows = await Repository.getSchedulesByScope({ termId: liveTermId });
          const rows = termRows.filter(row => row.AdInstructorId === person.AdInstructorId);
          const courseById = new Map(courses.map(row => [row.AdCourseId, row]));
          const collegeById = new Map(colleges.map(row => [Number(row.AdCollegeId), row]));''',
              'calendar term-wide rows')
          cal = one(cal,
              '  const rowById = new Map(collegeRows.map(row => [Number(row.id), row]));',
              '  const rowById = new Map(termRows.map(row => [Number(row.id), row]));',
              'calendar cover source')
          cal = one(cal,
              '        room: [covered.AdRoomCode, covered.AdRoomHall].filter(Boolean).join(" / "),',
              '        room: [collegeById.get(Number(covered.AdCollegeId))?.AdCollegeName, covered.AdRoomCode, covered.AdRoomHall].filter(Boolean).join(" / "),',
              'calendar cover location')
          cal = one(cal,
              '      room: [row.AdRoomCode, row.AdRoomHall].filter(Boolean).join(" / "),',
              '      room: [collegeById.get(Number(row.AdCollegeId))?.AdCollegeName, row.AdRoomCode, row.AdRoomHall].filter(Boolean).join(" / "),',
              'calendar lecture location')
          text = text[:cal_start] + cal + text[cal_end:]

          # The visible card tells the instructor exactly which site/department owns each row.
          page_start = text.index('function staffCardPage')
          page_end = text.index('function surveyPage', page_start)
          page = text[page_start:page_end]
          old_ui = ''''<small>'+[row.code,(row.room||row.hall)&&(esc(row.room||"")+"/"+esc(row.hall||""))].filter(Boolean).join(" · ")+'</small></span>';'''
          new_ui = ''''<small>'+[row.code,row.college,row.department,(row.room||row.hall)&&((row.room||"")+"/"+(row.hall||""))].filter(Boolean).map(esc).join(" · ")+'</small></span>';'''
          page = one(page, old_ui, new_ui, 'visible lecture location')
          text = text[:page_start] + page + text[page_end:]

          p.write_text(text, encoding='utf-8')

          test = r'''import fs from "fs";
          import path from "path";

          let passed = 0, failed = 0;
          function check(condition: boolean, name: string) {
            if (condition) { passed++; console.log(`\x1b[32m✓ ${name}\x1b[0m`); }
            else { failed++; console.log(`\x1b[31m✗ ${name}\x1b[0m`); }
          }

          const server = fs.readFileSync(path.join(process.cwd(), "server.ts"), "utf8");
          const card = server.slice(server.indexOf("async function buildStaffCard"), server.indexOf('app.get("/api/share"'));
          const calendar = server.slice(server.indexOf('app.get("/api/public/ics/:token/:key"'), server.indexOf("const STAFF_NOTES_PER_DAY"));
          const page = server.slice(server.indexOf("function staffCardPage"), server.indexOf("function surveyPage"));

          check(card.includes("Repository.getSchedulesByScope({ termId: link.AdTermId })"), "staff link opens the instructor across the whole term");
          check(card.includes("Repository.getSchedulesByScope({ termId: displayTermId })"), "term switching remains institution-wide");
          check(!card.includes("getSchedulesByScope({ collegeId: link.AdCollegeId, termId:"), "issuing college no longer trims the instructor card");
          check(card.includes("requestScopeMap") && card.includes("getInstructorRequests(scope.collegeId, scope.sectionId"), "requests follow each lecture's real college and section");
          check(card.includes("movementScopeMap") && card.includes("getScheduleVersions(scope.collegeId, scope.sectionId"), "movement history follows every real teaching scope");
          check(card.includes("row.college") && card.includes("department:"), "lecture rows carry their teaching location");
          check(card.includes('teachingColleges.length > 1 ? "كل مواقعك"'), "multi-site card is labelled as all locations");
          check(page.includes("row.college") && page.includes("row.department") && page.includes(".map(esc)"), "visible timetable identifies site and department safely");
          check(calendar.includes("Repository.getSchedulesByScope({ termId: liveTermId })"), "personal calendar follows the instructor institution-wide");
          check(!calendar.includes("collegeId: resolved.link.AdCollegeId, termId: liveTermId"), "personal calendar is not limited to the issuing college");
          check(calendar.includes("collegeById.get(Number(row.AdCollegeId))?.AdCollegeName"), "calendar location identifies the real college/site");

          console.log(`\nStaff-card global-scope audit: ${passed} passed, ${failed} failed`);
          process.exit(failed ? 1 : 0);
          '''
          Path('tests/staff-card-global-scope-audit.ts').write_text(textwrap.dedent(test), encoding='utf-8')

          package = Path('package.json')
          pkg = package.read_text(encoding='utf-8')
          if '"test:staff-global"' not in pkg:
              chain_old = '"test": "npm run test:hardening && npm run test:demo-roles'
              chain_new = '"test": "npm run test:hardening && npm run test:staff-global && npm run test:demo-roles'
              if pkg.count(chain_old) != 1:
                  raise SystemExit('package test chain anchor not found exactly once')
              pkg = pkg.replace(chain_old, chain_new, 1)
              script_old = '"test:hardening": "tsx tests/input-hardening-audit.ts",'
              script_new = '"test:hardening": "tsx tests/input-hardening-audit.ts",\n    "test:staff-global": "tsx tests/staff-card-global-scope-audit.ts",'
              if pkg.count(script_old) != 1:
                  raise SystemExit('package script anchor not found exactly once')
              pkg = pkg.replace(script_old, script_new, 1)
          package.write_text(pkg, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted regression audit
        run: npm run test:staff-global

      - name: Run full test suite
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified repair and remove temporary runner
        shell: bash
        run: |
          git checkout -- src/generated/buildStamp.ts 2>/dev/null || true
          rm -f .github/workflows/diagnose-staff-card.yml
          git add server.ts package.json tests/staff-card-global-scope-audit.ts .github/workflows/diagnose-staff-card.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(staff-card): show instructor schedule across all locations"
          git push origin HEAD:main
