name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Files from the sibling "website" project have been uploaded here twice.
      # They break tsc with a dozen unresolved imports while the build stays
      # green, so the real cause is easy to miss. Name it in one line instead.
      - name: Reject files from another project
        run: |
          strays=$(git ls-files 'src/pages/*' 'src/components/InterfacePolish.tsx')
          if [ -n "$strays" ]; then
            echo "::error::ملفات من مشروع website تسرّبت إلى مستودع الجدول. احذفها:"
            echo "$strays" | while read -r f; do echo "::error file=$f::$f لا ينتمي لهذا المشروع"; done
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
