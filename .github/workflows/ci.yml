name: Comprehensive CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (noEmit)
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Run Gemini Layer tests
        run: npm run test:gemini-layer

      - name: Production Build
        run: npm run build
