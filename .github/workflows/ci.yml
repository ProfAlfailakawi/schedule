name: Comprehensive CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (noEmit)
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Production Build
        run: npm run build

  patch-cross-college:
    name: Apply cross-college request fix
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply repair
        shell: bash
        run: |
          cat .github/cross-college-patch.part1 .github/cross-college-patch.part2 .github/cross-college-patch.part3 .github/cross-college-patch.part4 | base64 -d | gzip -d > /tmp/cross_patch.py
          python3 /tmp/cross_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Targeted cross-college regression
        run: npm run test:request-cross-college

      - name: Run all tests
        run: npm test

      - name: TypeScript check (noEmit)
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Comprehensive CI

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              name: Verify Project
              runs-on: ubuntu-24.04
              timeout-minutes: 20

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v6

                - name: Set up Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: "22"
                    cache: "npm"

                - name: Set up Python
                  uses: actions/setup-python@v6
                  with:
                    python-version: "3.12"

                - name: Install dependencies
                  run: npm ci

                - name: TypeScript check (noEmit)
                  run: npm run lint

                - name: Run all tests
                  run: npm test

                - name: Production Build
                  run: npm run build
          YAML
          rm -f .github/cross-college-patch.py.gz.b64 .github/cross-college-patch.part1 .github/cross-college-patch.part2 .github/cross-college-patch.part3 .github/cross-college-patch.part4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified changes to commit"; exit 1; }
          git commit -m "fix(instructor-request): choose college before cross-site course"
          git push origin HEAD:main
