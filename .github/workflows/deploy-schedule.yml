name: Deploy SCHEDULE

on:
  workflow_run:
    workflows: [Comprehensive CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: schedule-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the official service (schedule-kw.com)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Single owner of production deploys: ONLY ProfAlfailakawi/schedule-kw may deploy.
    # The same file lives in the previous repository, where this condition is always
    # false, so a push or a re-enabled workflow there can never release to production.
    # PRODUCTION_DEPLOY_ENABLED is the owner's kill switch (repository variable).
    if: github.repository == 'ProfAlfailakawi/schedule-kw' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    steps:
      - name: Check out SCHEDULE
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate (identity lives in schedule-863eb, which only builds images)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: schedule-863eb
          workload_identity_provider: projects/929900395059/locations/global/workloadIdentityPools/github/providers/schedule
          service_account: schedule-deployer@schedule-863eb.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and publish one immutable image
        env:
          IMAGE: europe-west1-docker.pkg.dev/schedule-863eb/schedule/schedule:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # ── الوجهة الرسمية: خدمة schedule في gen-lang-client-0379571946 ─────────
      # schedule-kw.com is a Cloud Run domain mapping on THIS
      # service (europe-west1), and it has served the site for months. The
      # image is built in schedule-863eb's registry above, but the release must
      # land here or the official domain never sees it (2026-10-16: it did not,
      # for a whole day). Only the image changes; the service keeps its own
      # runtime identity, env and secrets exactly as they are.
      # One region only (2026-10-17, owner's decision): the London twin
      # (europe-west2) carried almost no traffic and was deleted. A second region
      # served the same Firestore with its own in-memory state; one region keeps
      # every request on the same rules.
      - name: Deploy the release to the official service (Belgium)
        env:
          IMAGE: europe-west1-docker.pkg.dev/schedule-863eb/schedule/schedule:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gcloud run deploy schedule \
            --project=gen-lang-client-0379571946 \
            --region=europe-west1 \
            --image="$IMAGE" \
            --quiet

      # «Deploy: success» is not proof the site changed (2026-10-16). The release
      # counts only when schedule-kw.com serves the same build as the
      # official service it is mapped to.
      - name: Verify the official domain serves this release
        run: |
          official="https://schedule-34704073784.europe-west1.run.app/sw.js"
          domain="https://schedule-kw.com/sw.js"
          want=$(curl -fsS --max-time 20 "$official" | grep -o 'BUILD="[^"]*"' || true)
          echo "official service: $want"
          for attempt in $(seq 1 20); do
            got=$(curl -fsS --max-time 20 "$domain" | grep -o 'BUILD="[^"]*"' || true)
            echo "domain (try $attempt): ${got:-unreachable}"
            if [ -n "$want" ] && [ "$got" = "$want" ]; then echo "✓ schedule-kw.com serves this release"; exit 0; fi
            sleep 30
          done
          echo "::error::schedule-kw.com is not serving the deployed build. Do NOT touch the domain mapping — see docs/DELIVERY_OPERATIONS.md."
          exit 1
