name: Repair instructor request opening

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply root repair
        run: python3 scripts/request-page-hotfix.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted request regression
        run: npm run test:request-cross-college && npm run test:instructor-request-server
      - name: TypeScript check
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/request-page-hotfix.yml scripts/request-page-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts tests/instructor-request-cross-college-audit.ts .github/workflows/request-page-hotfix.yml scripts/request-page-hotfix.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(instructor-request): open cross-college form without blocking"
          git push origin HEAD:main
