name: Finalize instructor request repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Align permanent audit
        run: python3 scripts/finalize-request-audit.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted regression
        run: npm run test:request-cross-college && npm run test:instructor-request-server
      - name: TypeScript check
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified final state
        shell: bash
        run: |
          rm -f .github/workflows/finalize-request-audit.yml scripts/finalize-request-audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/instructor-request-server-audit.ts .github/workflows/finalize-request-audit.yml scripts/finalize-request-audit.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "test(instructor-request): lock fast cross-college opening"
          git push origin HEAD:main
