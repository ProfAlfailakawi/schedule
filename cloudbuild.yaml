# NOT the deploy path. Production deploys run from .github/workflows/deploy-schedule.yml
# to the official service (gen-lang-client-0379571946 / schedule), which carries the
# schedule.dr-alfailakawi.com domain mapping. No Cloud Build trigger uses this file.
substitutions:
  # SCHEDULE is deployed to its own Google Cloud project. Billing may be shared
  # across projects; project IDs and Firestore databases must remain isolated.
  _DEPLOY_PROJECT_ID: 'schedule-863eb'
  _RUNTIME_SERVICE_ACCOUNT: 'schedule-runtime@schedule-863eb.iam.gserviceaccount.com'
  _FIRESTORE_PROJECT_ID: 'gen-lang-client-0379571946'
  _FIRESTORE_DATABASE_ID: 'ai-studio-schedule-337bbbf5-1098-44cb-aabf-95536daf9106'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${_DEPLOY_PROJECT_ID}/schedule/schedule:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/${_DEPLOY_PROJECT_ID}/schedule/schedule:$COMMIT_SHA'

  # London is the primary run.app service; Belgium serves the custom domain.
  # Both regions use the exact same image, runtime identity and Firestore target.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'schedule'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - 'europe-west1-docker.pkg.dev/${_DEPLOY_PROJECT_ID}/schedule/schedule:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--service-account'
      - '${_RUNTIME_SERVICE_ACCOUNT}'
      - '--cpu'
      - '8'
      - '--memory'
      - '4Gi'
      - '--max'
      - '13'
      - '--timeout'
      - '1800'
      - '--set-env-vars'
      - 'DATA_MODE=firestore,AUTO_IMPORT_LEGACY_DATA=false,FIREBASE_PROJECT_ID=${_FIRESTORE_PROJECT_ID},FIREBASE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},GEMINI_SCHEDULE_MODEL=gemini-3.6-flash'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--quiet'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'schedule'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - 'europe-west1-docker.pkg.dev/${_DEPLOY_PROJECT_ID}/schedule/schedule:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--service-account'
      - '${_RUNTIME_SERVICE_ACCOUNT}'
      - '--cpu'
      - '8'
      - '--memory'
      - '4Gi'
      - '--max'
      - '13'
      - '--timeout'
      - '1800'
      - '--set-env-vars'
      - 'DATA_MODE=firestore,AUTO_IMPORT_LEGACY_DATA=false,FIREBASE_PROJECT_ID=${_FIRESTORE_PROJECT_ID},FIREBASE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},GEMINI_SCHEDULE_MODEL=gemini-3.6-flash'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/${_DEPLOY_PROJECT_ID}/schedule/schedule:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
