steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/schedule:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/schedule:$COMMIT_SHA'

  # ── لندن: الوجهة الأصلية، تبقى كما هي ─────────────────────────────────────
  # This is the region the load balancer has always pointed at and the one the
  # Studio trigger was created for. It deploys first and unchanged, so a failure
  # in the step below can never leave production without a fresh revision.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'schedule'
      - '--image'
      - 'gcr.io/$PROJECT_ID/schedule:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      # قراءة مسح كامل تستغرق 3–5 دقائق؛ مهلة 300 ثانية كانت تقطع البث في
      # منتصف القراءة فيظهر «انقطع الاتصال بالخادم» بعد دقائق من الانتظار.
      - '--timeout'
      - '1800'
      - '--quiet'

  # ── بلجيكا: الوجهة المجانية للنطاق ────────────────────────────────────────
  #
  # schedule.dr-alfailakawi.com maps DIRECTLY to this service through a Cloud
  # Run domain mapping, which is free. The global load balancer it replaces
  # billed ~$18/month whether or not anyone visited, and it never routed to
  # Doha anyway (its only backend was London). Domain mappings are not offered
  # in europe-west2 or me-central1; europe-west1 is the nearest region that has
  # them, and Firestore sits in London, a few milliseconds away.
  #
  # Same image, same commit, same build as London above, so the two regions can
  # never serve different code. London stays reachable on its run.app address.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'schedule'
      - '--image'
      - 'gcr.io/$PROJECT_ID/schedule:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--timeout'
      - '1800'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/schedule:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
