<meta name="theme-color" content="#EEF4FF">
<style>
@font-face{font-family:'Cairo';font-style:normal;font-weight:300;font-display:swap;src:url('/plans/fonts/cairo-arabic-300-normal.woff2') format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE80-FEFC}

@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url('/plans/fonts/cairo-arabic-700-normal.woff2') format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE80-FEFC}
@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url('/plans/fonts/cairo-latin-700-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Cairo';font-style:normal;font-weight:900;font-display:swap;src:url('/plans/fonts/cairo-latin-900-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

<style>
:root{color-scheme:light;--ink:#0B2545;--mut:#475569;--bg:#EEF4FF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 0}
svg text{font-family:'Cairo','Tajawal',system-ui,sans-serif}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 160px;touch-action:pan-x pan-y}
#plan{display:block;width:100%;min-width:1180px;max-width:1754px;height:auto;margin:0 auto}
html.fit #plan{min-width:0}
#fitbtn{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0));left:14px;z-index:8;display:flex;align-items:center;gap:6px;border:0;background:#0B2545;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(11,37,69,.28);cursor:pointer}
#fitbtn svg{width:17px;height:17px}
@media (min-width:1200px){#fitbtn{display:none}}
#pdfbtn{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0));right:14px;z-index:8;display:flex;align-items:center;gap:6px;border:0;background:#fff;color:#0B2545;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(11,37,69,.18);cursor:pointer;border:1px solid #CBD5E1}
#pdfbtn svg{width:17px;height:17px}
.card{cursor:pointer;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
/* The chosen course lifts out of the plan */
#plan{--pop:1.08}
.card.pick{transform:scale(var(--pop));animation:pop .34s ease-out}
.card.pick>rect:first-child{stroke:var(--ring,#0B2545);stroke-opacity:1;stroke-width:4.5;filter:drop-shadow(0 0 12px var(--glow,rgba(11,37,69,.45)));animation:glow 1.4s ease-in-out 2}
@keyframes glow{50%{filter:drop-shadow(0 0 26px var(--glow,rgba(11,37,69,.45)))}}
/* Floating name tag for the chosen course on phones: readable at any zoom without covering the arrows */
#tag{position:fixed;left:0;top:0;z-index:8;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 16px);background:#fff;color:var(--ink);border:2px solid var(--k);border-radius:14px;padding:6px 12px;font-size:15px;font-weight:800;line-height:1.35;box-shadow:0 10px 26px rgba(11,37,69,.22);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s}
#tag.on{opacity:1;transform:none}
#tag b{color:var(--k);font-size:17px;font-weight:900}
#tag::after{content:"";position:absolute;left:var(--tx,50%);bottom:-8px;width:12px;height:12px;background:#fff;border:2px solid var(--k);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
#tag.below::after{bottom:auto;top:-8px;transform:translateX(-50%) rotate(225deg)}
#tag.side-l::after,#tag.side-r::after{bottom:auto;top:var(--ty,50%)}
#tag.side-l::after{left:auto;right:-8px;transform:translateY(-50%) rotate(-45deg)}
#tag.side-r::after{left:-8px;transform:translateY(-50%) rotate(135deg)}
/* الاسمُ يظهر في البطاقة المضيئة وفي عنوان اللوحة؛ ثالثٌ فوقها تكرار. */
#tag{display:none!important}
/* اللوحةُ المفتوحة تغطي أسفل الشاشة: لا أزرارَ ثابتة ولا شريطَ فوقها. */
html.sheet-open #stbar,html.sheet-open #fitbtn,html.sheet-open #pdfbtn,html.sheet-open #stbtn,html.sheet-open #hint{display:none!important}
@keyframes pop{0%{transform:scale(1)}60%{transform:scale(calc(var(--pop) * 1.08))}100%{transform:scale(var(--pop))}}
.edge{transition:opacity .2s}
.dim{opacity:.12}
.card:focus{outline:none}
.card:focus-visible rect{stroke:#0B2545;stroke-opacity:1;stroke-width:4}
.card.sel rect{stroke-opacity:1;stroke-width:4}
#sheet{position:fixed;inset:auto 0 0 0;max-width:760px;margin:0 auto 14px;background:#fff;border-radius:24px;padding:18px 20px calc(16px + env(safe-area-inset-bottom,0));box-shadow:0 24px 60px rgba(11,37,69,.25),0 0 0 1px rgba(11,37,69,.06);z-index:9;max-height:58vh;overflow:auto;transform:translateY(calc(100% + 40px));transition:transform .32s cubic-bezier(.2,.9,.25,1);border-top:6px solid var(--c,#0B2545)}
#sheet.open{transform:none}
#sheet.zoomed{transition:none;margin:0;max-width:none;transform-origin:0 0}
#sheet.zoomed:not(.open){display:none}
#sheet .hd{display:flex;align-items:center;gap:14px;padding-left:44px}
#sheet .num{font-size:34px;font-weight:900;color:var(--c);line-height:1}
#sheet h3{margin:0;font-size:19px;font-weight:900;line-height:1.35}
#sheet .sub{font-size:13px;color:var(--mut);font-weight:700;margin-top:2px}
#sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
#sheet .l{font-size:13px;font-weight:900;color:var(--mut);margin:0 0 6px;display:flex;align-items:center;gap:6px}
#sheet .l i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#EEF4FF;font-size:13px}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1.5px solid #E2E8F0;background:#fff;border-radius:14px;padding:7px 12px;margin:0 0 7px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.chip b{color:var(--k);font-size:17px;font-weight:900;min-width:34px}
.chip:hover,.chip:focus-visible{border-color:var(--k);background:color-mix(in srgb,var(--k) 7%,#fff);transform:translateX(-3px);outline:none}
.chip.x{cursor:default;background:#F8FAFC;color:#64748b}.chip.x:hover{transform:none;border-color:#E2E8F0}
.l.far{margin-top:12px;font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.chip.sm{display:inline-flex;width:auto;margin:0;padding:4px 11px;gap:6px;font-size:13px;border-style:dashed;border-radius:999px}.chip.sm b{font-size:14px;min-width:0}
.none{font-size:14px;color:#64748b;font-weight:700;padding:6px 2px}
.x2{position:absolute;left:14px;top:14px;border:0;background:#EEF4FF;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink)}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B2545;color:#fff;font-size:14.5px;font-weight:700;padding:10px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(11,37,69,.3);z-index:8;white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none}
#hint.gone{opacity:0;transform:translate(-50%,20px)}
.card rect{transition:stroke-width .2s,stroke-opacity .2s}
.card:hover rect{stroke-opacity:1;stroke-width:2.5}
.edge.on path[marker-end]{stroke-width:3.4;stroke-dasharray:9 6;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.edge.on path[marker-end]{animation:none;stroke-dasharray:none}#sheet{transition:none}.card,.card.pick{transition:none;animation:none}}
@media (max-width:1199px){#sheet{max-height:46vh}}
@media (max-width:640px){#sheet{margin:0;border-radius:24px 24px 0 0}#sheet .cols{grid-template-columns:1fr}#hint{font-size:13px}}
#stbtn{position:fixed;bottom:calc(126px + env(safe-area-inset-bottom,0));right:14px;z-index:8;display:flex;align-items:center;gap:6px;border:1px solid #CBD5E1;background:#fff;color:#0B2545;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(11,37,69,.18);cursor:pointer}
#stbtn svg{width:17px;height:17px}
html.student #stbtn{background:#059669;color:#fff;border-color:#059669}
#stbar{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);background:#fff;border:1px solid #A7F3D0;border-radius:18px;padding:8px 16px;box-shadow:0 10px 28px rgba(11,37,69,.16);font-size:14px;font-weight:700;color:#0B2545}
html.student #stbar{display:flex}
#stbar b{color:#059669;font-size:17px}#stbar small{color:#64748B;font-weight:500}
#stbar button{border:0;background:none;color:#64748B;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
html.student #plan .card>rect:first-of-type{transition:fill .2s}
html.student #plan .card.ok>rect:first-of-type{fill:#D1FAE5}
html.student #plan .card.can>rect:first-of-type{fill:#FEF9C3;stroke:#CA8A04;stroke-opacity:1;stroke-width:2.5}
html.student #plan .card.no{opacity:.42}
html.student #plan .edge{opacity:.25}
@media (min-width:1200px){#stbtn{bottom:calc(126px + env(safe-area-inset-bottom,0))}}
#backlink{position:fixed;top:12px;right:12px;z-index:9;display:flex;align-items:center;gap:6px;background:#0B2545;color:#fff;text-decoration:none;font-weight:800;font-size:14.5px;padding:8px 16px 8px 12px;border-radius:999px;box-shadow:0 8px 22px rgba(11,37,69,.3)}
#backlink svg{width:16px;height:16px}
html.me #stbtn{display:none}
html.me #stbar small,html.me #stbar #streset{display:none}
/* خريطة الطالب: أربعةُ عناصر ثابتة كانت تتراكب أسفل الجوال. التلميحُ يُخفى، والشريطُ سطرٌ واحد في الأسفل، والزرّان فوقه بلا تداخل. */
html.me #hint{display:none}
html.me body{padding-top:calc(58px + env(safe-area-inset-top,0))}
html.me #stbar{bottom:calc(14px + env(safe-area-inset-bottom,0));flex-wrap:nowrap;gap:12px;padding:7px 16px;font-size:13px;white-space:nowrap}
html.me #stbar b{font-size:15px}
html.me #fitbtn,html.me #pdfbtn{bottom:calc(70px + env(safe-area-inset-bottom,0));padding:8px 12px;font-size:13px}
/* Print the entire variable-height SVG on one A4 landscape sheet (including iOS AirPrint).
   Do not force an A3-sized SVG into an A4 printer, which produces a nearly empty second page. */
@page{size:A4 landscape;margin:0}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important;width:297mm!important;height:210mm!important;overflow:hidden!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #sheet,#hint,#fitbtn,#pdfbtn,#stbtn,#stbar,#backlink,#tag{display:none!important}
 #dview,.scroll{display:block!important;position:static!important;margin:0!important;padding:0!important;width:297mm!important;height:210mm!important;min-height:0!important;max-height:210mm!important;overflow:hidden!important;box-shadow:none!important;border:0!important}
 #plan [filter]{filter:none}
 .card,.edge{opacity:1!important}
 #plan{display:block!important;width:297mm!important;height:210mm!important;min-width:0!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;break-inside:avoid!important;page-break-inside:avoid!important}
 html[data-print-rotate="1"],html[data-print-rotate="1"] body{width:210mm!important;height:297mm!important;max-width:210mm!important;max-height:297mm!important;overflow:hidden!important;direction:ltr!important}
 html[data-print-rotate="1"] #dview,html[data-print-rotate="1"] .scroll{width:210mm!important;height:297mm!important;max-width:210mm!important;max-height:297mm!important;overflow:visible!important;direction:ltr!important}
 html[data-print-rotate="1"] #plan{width:297mm!important;height:210mm!important;max-width:none!important;transform:translate(180.6mm,20.79mm) rotate(90deg) scale(.86)!important;transform-origin:0 0!important;direction:rtl!important}
}
</style>

<body>
<section id="dview"><div class="scroll">{{SVG}}</div></section>
<div id="sheet" role="dialog" aria-live="polite"></div>
<button id="fitbtn" type="button"></button>
<button id="pdfbtn" type="button" onclick="printPlan()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>تحميل PDF</button>
<button id="stbtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>وضع الطالب</button>
<div id="stbar" role="status" aria-live="polite"></div>
<div id="hint">اضغط على أي مقرر لترى ما يتطلبه وما يفتحه</div>
<script>
/* Isolated iOS print rotation, adapted from the comprehensive report. */
const isIOSWebKitPrint=/iPhone|iPad|iPod/i.test(navigator.userAgent||'');
function printPlan(){if(isIOSWebKitPrint)document.documentElement.dataset.printRotate='1';window.print()}
window.addEventListener('afterprint',()=>{delete document.documentElement.dataset.printRotate});
const D={{DATA}};
const C=D.C,EL=D.EL,E=D.E,H=D.H;
let sel=null;
const name=c=>C[c]?C[c][1]:EL[c]?EL[c][0]:'';
const up=(c,s=new Set())=>{E.forEach(([a,b])=>{if(b==c&&!s.has(a)){s.add(a);up(a,s)}});return s};
const dn=(c,s=new Set())=>{E.forEach(([a,b])=>{if(a==c&&!s.has(b)){s.add(b);dn(b,s)}});return s};
const hc=c=>H[c]||'#64748B';
const units=n=>`${n} ${n>2?'وحدات':'وحدة'}`;
const where=c=>C[c]?`${D.LV[C[c][0]][2]}${C[c][3]?' · '+C[c][3]:''} · ${units(C[c][2])}`:EL[c]?`${D.EL_LABEL||'اختياري'} · ${units(EL[c][1])}`:'';
const sh=document.getElementById('sheet'),hint=document.getElementById('hint');
let hov=null;
function paint(c){
 if(c==null){document.querySelectorAll('#plan .card,#plan .edge').forEach(e=>e.classList.remove('dim','sel','on'));return}
 const A=up(c),B=dn(c),S=new Set([...A,...B,c]);
 document.querySelectorAll('#plan .card').forEach(g=>{const k=+g.dataset.c;g.classList.toggle('dim',!S.has(k));g.classList.toggle('sel',k==c)});
 document.querySelectorAll('#plan .edge').forEach(g=>{const s=+g.dataset.s,t=+g.dataset.t;const on=((t==c||A.has(t))&&A.has(s))||((s==c||B.has(s))&&B.has(t));g.classList.toggle('dim',!on);g.classList.toggle('on',on)});
}
function render(){
 paint(sel??hov);
 plan.querySelectorAll('.card.pick').forEach(g=>g.classList.remove('pick'));
 if(sel!=null){const g=plan.querySelector(`.card[data-c="${sel}"]`);if(g){const f=document.activeElement===g;g.parentNode.appendChild(g);if(f)g.focus({preventScroll:true});placePop(g);g.classList.add('pick')}}
 if(sel==null){sh.classList.remove('open');document.documentElement.classList.remove('sheet-open');return}
 hint.classList.add('gone');
 const pre=E.filter(e=>e[1]==sel).map(e=>e[0]),nx=E.filter(e=>e[0]==sel).map(e=>e[1]);
 const ors=(D.OR||[]).filter(g=>g[0]==sel).map(g=>g[1]),inOr=new Set(ors.flat().map(String)),req=pre.filter(c=>!inOr.has(String(c))),minU=(D.U||{})[sel];
 const far=[...up(sel)].filter(c=>!pre.includes(c)).sort((a,b)=>b-a);
 const chip=c=>`<button class="chip" style="--k:${hc(c)}" data-go="${c}"><b>${c}</b>${name(c)}</button>`;
 const col=hc(sel)==='#64748B'&&C[sel]?D.LV[C[sel][0]][0]:hc(sel);
 sh.style.setProperty('--c',col);
 const pc=plan.querySelector(`.card[data-c="${sel}"]`);if(pc){pc.style.setProperty('--glow',col+'cc');pc.style.setProperty('--ring',col)}
 tag.style.setProperty('--k',col);tag.innerHTML=`<b>${sel}</b>${name(sel)}`;
 sh.innerHTML=`<button class="x2" aria-label="إغلاق">✕</button>
 <div class="hd"><span class="num">${sel}</span><div><h3>${name(sel)}</h3><div class="sub">${where(sel)}${window.__st&&D.ME?' · <b>'+window.__st(sel)+'</b>':''}</div></div></div>
 <div class="cols"><div><div class="l"><i>←</i>يتطلب قبله</div>${req.map(chip).join('')}${ors.map(g=>'<div class="l far">أحد المقررات</div>'+g.map(chip).join('')).join('')}${minU?`<div class="none">واجتياز وحدات لا تقل عن ${minU}</div>`:''}${far.length?'<div class="l far">وقبلها في السلسلة</div><div class="pills">'+far.map(c=>chip(c).replace('class="chip"','class="chip sm"')).join('')+'</div>':''}${pre.length||minU?'':'<div class="none">لا يتطلب مقررًا سابقًا — يمكن تسجيله مباشرة</div>'}</div>
 <div><div class="l"><i>→</i>يفتح بعده</div>${nx.map(chip).join('')||'<div class="none">لا يفتح مقررات أخرى</div>'}</div></div>`;
 sh.classList.add('open');document.documentElement.classList.add('sheet-open');
}
// On phones the plan does its own pinch-zoom (Safari won't let a page zoom itself back out),
// so choosing a course can zoom to its chain above the sheet; closing restores the previous view.
const small=matchMedia('(max-width:1199px)'),box=document.querySelector('.scroll');
let autoFit=null;
const view=()=>({fit:document.documentElement.classList.contains('fit'),w:plan.style.width,sl:box.scrollLeft,sy:scrollY});
function setW(w){plan.style.width=w||'';plan.style.minWidth=w?'0':'';plan.style.maxWidth=w?'none':''}
// The chosen card grows by --pop around its centre, shifted inward near the plan's edges so it never leaves the plan.
const popOf=()=>parseFloat(getComputedStyle(plan).getPropertyValue('--pop'))||1;
function popBox(b,f){
 const W=plan.viewBox.baseVal.width,H=plan.viewBox.baseVal.height,w=b.width*f,h=b.height*f;
 const x=Math.min(Math.max(b.x-(w-b.width)/2,8),W-8-w),y=Math.min(Math.max(b.y-(h-b.height)/2,8),H-8-h);
 return {x,y,width:w,height:h,ox:(x-b.x)/(b.width-w||1),oy:(y-b.y)/(b.height-h||1)};
}
function placePop(g){const o=popBox(g.getBBox(),popOf());g.style.transformOrigin=`${o.ox*100}% ${o.oy*100}%`}
// Zoom so the selected course's whole chain fills the space above the sheet.
function zoomToChain(){
 if(autoFit==null)autoFit=view();
 const S=new Set([...up(sel),...dn(sel),sel]),P=24;
 const full=plan.viewBox.baseVal.width,fullH=plan.viewBox.baseVal.height,cw=box.clientWidth,ah=innerHeight-sh.offsetHeight;

 // Frame the chain with the chosen card at its enlarged size, or it can spill off screen.
 const frame=pop=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  plan.querySelectorAll('.card').forEach(e=>{const c=+e.dataset.c;if(!S.has(c))return;const b=c==sel?popBox(e.getBBox(),pop):e.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)});

 let f=frame(popOf());

// Put the tag above or below the chosen card, on whichever side covers fewer of its chain, and keep it clear of the sheet.
function placeTag(){

 if(!g){tag.classList.remove('on');return}

 const S=new Set([...up(sel),...dn(sel)]),chain=[...plan.querySelectorAll('.card')].filter(e=>S.has(+e.dataset.c)).map(e=>e.querySelector('rect').getBoundingClientRect());
 // Candidates above, below, left and right of the card; keep the one hiding the least of its chain (by area).
 const vw=innerWidth,cx=r.left+r.width/2,cy=r.top+r.height/2,G=12;

 const xs=[cx-tw/2,r.left-8,r.right+8-tw].map(clampX);

  ...xs.map(x=>({k:'',x,y:r.top-th-G})),
  ...xs.map(x=>({k:'below',x,y:r.bottom+G})),
  {k:'side-l',x:r.left-tw-G,y:clampY(cy-th/2)},
  {k:'side-r',x:r.right+G,y:clampY(cy-th/2)}

 tag.style.transform='';tag.style.left=best.x+'px';tag.style.top=best.y+'px';
 tag.classList.remove('below','side-l','side-r');if(best.k)tag.classList.add(best.k);

function pick(c){

// Pinch-zoom scales fixed elements too; keep the sheet at its natural size inside the visible area.
const vv=window.visualViewport;
function placeSheet(){

// Student mode: tap the courses you passed; what is open to you now lights up. Kept on this device only.
(function(){

  const ors=(D.OR||[]).filter(g=>g[0]==c).map(g=>g[1].map(String)),inOr=new Set(ors.flat());
