:root{color-scheme:light;--ink:#0B2545;--mut:#475569;--bg:#EEF4FF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 0}
svg text{font-family:'Cairo','Tajawal',system-ui,sans-serif}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 160px}
#plan{display:block;width:100%;min-width:1180px;max-width:1754px;height:auto;margin:0 auto}
.card{cursor:pointer;transition:opacity .2s}
.edge{transition:opacity .2s}
.dim{opacity:.12}
.card:focus{outline:none}
.card:focus-visible rect{stroke:#0B2545;stroke-opacity:1;stroke-width:4}
.card.sel rect{stroke-opacity:1;stroke-width:4}
#sheet{position:fixed;inset:auto 0 0 0;max-width:820px;margin:0 auto;background:#fff;border-top:2px solid #0B2545;border-radius:20px 20px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));box-shadow:0 -6px 24px rgba(11,37,69,.18);z-index:9;display:none;max-height:45vh;overflow:auto}
#sheet h3{margin:0 0 8px;font-size:17px;font-weight:900}
#sheet .l{font-size:13px;font-weight:800;color:var(--mut);margin:8px 0 4px}
.chip{border:2px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:3px 12px;margin:0 0 4px 6px;font-size:15px;font-weight:900;cursor:pointer}
.chip.x{border-color:#94a3b8;color:#64748b;cursor:default}
.x2{position:absolute;left:12px;top:10px;border:0;background:#EEF4FF;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
@page{size:420mm 297mm;margin:0}
@media print{
 html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #sheet{display:none!important}
 .scroll{overflow:visible;padding:0}
 #plan [filter]{filter:none}
 .card,.edge{opacity:1!important}
 #plan{width:420mm;height:297mm;min-width:0;max-width:none}
}

const D={"C": {"105": [1, 1, "أسس تكنولوجيا التعليم", 3], "108": [1, 1, "أخلاقيات استخدام التكنولوجيا", 3], "121": [1, 2, "نظريات التعلم والتكنولوجيا", 3], "122": [1, 2, "الاتصال والثقافة المرئية", 3], "123": [1, 2, "مصادر رقمية", 3], "220": [2, 1, "تكنولوجيا الصوت", 3], "221": [2, 1, "التصوير والصورة", 3], "224": [2, 1, "مصادر التعلم المفتوحة", 3], "233": [2, 1, "التصميم التعليمي", 3], "321": [2, 2, "تصميم الجرافيك", 3], "322": [2, 2, "إنتاج الفيديو التعليمي", 3], "323": [2, 2, "التكنولوجيا وبيئات التعلم", 3], "325": [2, 2, "التكنولوجيا المساعدة", 3], "343": [3, 1, "تصميم وإنتاج الوسائط المتعددة", 3], "346": [3, 1, "التقييم في تكنولوجيا التعليم", 3], "347": [3, 1, "التعلم عبر الإنترنت والمدمج", 3], "453": [3, 2, "إدارة مراكز مصادر التعلم", 3], "454": [3, 2, "البث عبر الإنترنت", 3], "459": [3, 2, "القيادة والتطوير المهني", 3], "455": [4, 1, "التدريب الميداني (1)", 3], "468": [4, 1, "مشروع التخرج", 3], "492": [4, 2, "حلقة بحث - تكنولوجيا التعليم", 3], "498": [4, 2, "التدريب الميداني (2)", 4]}, "EL": {"226": "التفكير الحاسوبي", "315": "التصوير المتقدم", "401": "الذكاء الاصطناعي في التعليم", "410": "التلعيب والمحاكاة"}, "E": [[105, 121], [105, 122], [105, 123], [108, 123], [108, 226], [108, 323], [121, 233], [122, 220], [122, 221], [123, 224], [220, 322], [221, 315], [221, 322], [224, 226], [224, 325], [233, 321], [233, 322], [233, 323], [233, 401], [321, 343], [322, 343], [323, 346], [323, 347], [323, 410], [343, 454], [346, 453], [346, 455], [346, 459], [453, 468], [455, 492], [455, 498], [459, 498]], "H": {"105": "#D81B60", "108": "#1E88E5", "121": "#2E7D32", "122": "#8E24AA", "123": "#EF6C00", "220": "#00838F", "221": "#3949AB", "224": "#B71C1C", "233": "#689F38", "321": "#0097A7", "322": "#6D4C41", "323": "#5E35B1", "343": "#F9A825", "346": "#0277BD", "453": "#00897B", "455": "#AD1457", "459": "#546E7A"}, "YC": {"1": ["#2563EB", "#DBEAFE", "السنة الأولى"], "2": ["#059669", "#D1FAE5", "السنة الثانية"], "3": ["#7C3AED", "#EDE9FE", "السنة الثالثة"], "4": ["#EA580C", "#FFEDD5", "السنة الرابعة"]}};
const C=D.C,EL=D.EL,E=D.E,H=D.H;
let sel=null;
const name=c=>C[c]?C[c][2]:EL[c];
const up=(c,s=new Set())=>{E.forEach(([a,b])=>{if(b==c&&!s.has(a)){s.add(a);up(a,s)}});return s};
const dn=(c,s=new Set())=>{E.forEach(([a,b])=>{if(a==c&&!s.has(b)){s.add(b);dn(b,s)}});return s};
const hc=c=>H[c]||'#64748B';
function render(){
 const all=document.querySelectorAll('#plan .card,#plan .edge');
 
 const sh=document.getElementById('sheet');
 if(sel==null){all.forEach(e=>e.classList.remove('dim','sel'));sh.style.display='none';return}
 const A=up(sel),B=dn(sel),S=new Set([...A,...B,sel]);
 document.querySelectorAll('#plan .card').forEach(g=>{const c=+g.dataset.c;g.classList.toggle('dim',!S.has(c));g.classList.toggle('sel',c==sel)});
 document.querySelectorAll('#plan .edge').forEach(g=>{const s=+g.dataset.s,t=+g.dataset.t;const on=((t==sel||A.has(t))&&A.has(s))||((s==sel||B.has(s))&&B.has(t));g.classList.toggle('dim',!on)});
 
 const pre=E.filter(e=>e[1]==sel).map(e=>e[0]),nx=E.filter(e=>e[0]==sel).map(e=>e[1]);
 const chip=c=>`<button class="chip" style="--c:${hc(c)}" onclick="pick(${c})">${c} · ${name(c)}</button>`;
 let h=`<button class="x2" onclick="pick(null)" aria-label="إغلاق">✕</button><h3>${sel} · ${name(sel)}</h3>`;
 h+=`<div class="l">يتطلب</div>`+((pre.length||sel==325)?pre.map(chip).join('')+(sel==325?'<button class="chip x">150 (غير ظاهر في المخطط)</button>':''):'<span style="color:#64748b;font-size:14px">لا يتطلب مقررًا من المخطط</span>');
 h+=`<div class="l">يفتح</div>`+(nx.length?nx.map(chip).join(''):'<span style="color:#64748b;font-size:14px">لا يفتح مقررات أخرى</span>');
 sh.innerHTML=h;sh.style.display='block';
}
function pick(c){sel=(c==null||c==sel)?null:c;render()}
document.getElementById('plan').addEventListener('keydown',e=>{const g=e.target.closest('.card');if(!g)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(+g.dataset.c)}else if(e.key==='Escape'){sel=null;render()}});
document.getElementById('plan').addEventListener('click',e=>{const g=e.target.closest('.card');if(g)pick(+g.dataset.c);else{sel=null;render()}});
window.addEventListener('beforeprint',()=>{sel=null;render()});
</script>
</body>
</html>
