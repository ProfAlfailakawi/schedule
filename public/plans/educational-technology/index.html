<style>
:root{color-scheme:light;--ink:#0B2545;--mut:#475569;--bg:#EEF4FF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 0}
svg text{font-family:'Cairo','Tajawal',system-ui,sans-serif}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 160px}
#plan{display:block;width:100%;min-width:1180px;max-width:1754px;height:auto;margin:0 auto}
html.fit #plan{min-width:0}
#fitbtn{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0));left:14px;z-index:8;display:flex;align-items:center;gap:6px;border:0;background:#0B2545;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(11,37,69,.28);cursor:pointer}
#fitbtn svg{width:17px;height:17px}
@media (min-width:1200px){#fitbtn{display:none}}
.card{cursor:pointer;transition:opacity .2s}
.edge{transition:opacity .2s}
.dim{opacity:.12}
.card:focus{outline:none}
.card:focus-visible rect{stroke:#0B2545;stroke-opacity:1;stroke-width:4}
.card.sel rect{stroke-opacity:1;stroke-width:4}
#sheet{position:fixed;inset:auto 0 0 0;max-width:760px;margin:0 auto 14px;background:#fff;border-radius:24px;padding:18px 20px calc(16px + env(safe-area-inset-bottom,0));box-shadow:0 24px 60px rgba(11,37,69,.25),0 0 0 1px rgba(11,37,69,.06);z-index:9;max-height:58vh;overflow:auto;transform:translateY(calc(100% + 40px));transition:transform .32s cubic-bezier(.2,.9,.25,1);border-top:6px solid var(--c,#0B2545)}
#sheet.open{transform:none}
#sheet.zoomed{transition:none;margin:0;max-width:none;transform-origin:0 0}
#sheet.zoomed:not(.open){display:none}
#sheet .hd{display:flex;align-items:center;gap:14px;padding-left:44px}
#sheet .num{font-size:34px;font-weight:900;color:var(--c);line-height:1}
#sheet h3{margin:0;font-size:19px;font-weight:900;line-height:1.35}
#sheet .sub{font-size:13px;color:var(--mut);font-weight:700;margin-top:2px}
#sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
#sheet .l{font-size:13px;font-weight:900;color:var(--mut);margin:0 0 6px;display:flex;align-items:center;gap:6px}
#sheet .l i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#EEF4FF;font-size:13px}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1.5px solid #E2E8F0;background:#fff;border-radius:14px;padding:7px 12px;margin:0 0 7px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.chip b{color:var(--k);font-size:17px;font-weight:900;min-width:34px}
.chip:hover,.chip:focus-visible{border-color:var(--k);background:color-mix(in srgb,var(--k) 7%,#fff);transform:translateX(-3px);outline:none}
.chip.x{cursor:default;background:#F8FAFC;color:#64748b}.chip.x:hover{transform:none;border-color:#E2E8F0}
.none{font-size:14px;color:#64748b;font-weight:700;padding:6px 2px}
.x2{position:absolute;left:14px;top:14px;border:0;background:#EEF4FF;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink)}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B2545;color:#fff;font-size:14.5px;font-weight:700;padding:10px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(11,37,69,.3);z-index:8;white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none}
#hint.gone{opacity:0;transform:translate(-50%,20px)}
.card rect{transition:stroke-width .2s,stroke-opacity .2s}
.card:hover rect{stroke-opacity:1;stroke-width:2.5}
.edge.on path[marker-end]{stroke-width:3.4;stroke-dasharray:9 6;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.edge.on path[marker-end]{animation:none;stroke-dasharray:none}#sheet{transition:none}}
@media (max-width:640px){#sheet{margin:0;border-radius:24px 24px 0 0}#sheet .cols{grid-template-columns:1fr}#hint{font-size:13px}}
@page{size:420mm 297mm;margin:0}
@media print{
 html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #sheet,#hint,#fitbtn{display:none!important}
 .scroll{overflow:visible;padding:0}
 #plan [filter]{filter:none}
 .card,.edge{opacity:1!important}
 #plan{width:420mm;height:297mm;min-width:0;max-width:none}
}
</style>

 const A=up(c),B=dn(c),S=new Set([...A,...B,c]);
 document.querySelectorAll('#plan .card').forEach(g=>{const k=+g.dataset.c;g.classList.toggle('dim',!S.has(k));g.classList.toggle('sel',k==c)});
 document.querySelectorAll('#plan .edge').forEach(g=>{const s=+g.dataset.s,t=+g.dataset.t;const on=((t==c||A.has(t))&&A.has(s))||((s==c||B.has(s))&&B.has(t));g.classList.toggle('dim',!on);g.classList.toggle('on',on)});
}
function render(){
 paint(sel??hov);
 if(sel==null){sh.classList.remove('open');return}
 hint.classList.add('gone');
 const pre=E.filter(e=>e[1]==sel).map(e=>e[0]),nx=E.filter(e=>e[0]==sel).map(e=>e[1]);
 const chip=c=>`<button class="chip" style="--k:${hc(c)}" data-go="${c}"><b>${c}</b>${name(c)}</button>`;
 sh.style.setProperty('--c',hc(sel)==='#64748B'&&C[sel]?D.YC[C[sel][0]][0]:hc(sel));
 sh.innerHTML=`<button class="x2" aria-label="إغلاق">✕</button>
 <div class="hd"><span class="num">${sel}</span><div><h3>${name(sel)}</h3><div class="sub">${where(sel)}</div></div></div>
 <div class="cols"><div><div class="l"><i>←</i>يتطلب قبله</div>${pre.map(chip).join('')}${pre.length?'':'<div class="none">لا يتطلب مقررًا سابقًا — يمكن تسجيله مباشرة</div>'}</div>
 <div><div class="l"><i>→</i>يفتح بعده</div>${nx.map(chip).join('')||'<div class="none">لا يفتح مقررات أخرى</div>'}</div></div>`;
 sh.classList.add('open');
}
function pick(c){sel=(c==null||c==sel)?null:c;hov=null;render();placeSheet()}
// Pinch-zoom scales fixed elements too; keep the sheet at its natural size inside the visible area.
const vv=window.visualViewport;
function placeSheet(){
 if(!vv||vv.scale<1.05||!sh.classList.contains('open')){if(sh.classList.contains('zoomed')){sh.classList.remove('zoomed');['inset','bottom','left','top','width','max-height','transform'].forEach(k=>sh.style.removeProperty(k))}return}
 const k=1/vv.scale,W=Math.min(760,vv.width*vv.scale);
 sh.classList.add('zoomed');
 Object.assign(sh.style,{inset:'auto',bottom:'auto',left:(vv.offsetLeft+(vv.width-W*k)/2)+'px',top:(vv.offsetTop+vv.height)+'px',width:W+'px',maxHeight:(vv.height*vv.scale*.6)+'px',transform:`scale(${k}) translateY(-100%)`});
}
vv&&vv.addEventListener('resize',placeSheet);vv&&vv.addEventListener('scroll',placeSheet);

const plan=document.getElementById('plan');
plan.addEventListener('keydown',e=>{const g=e.target.closest('.card');if(!g)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(+g.dataset.c)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pick(null)});
plan.addEventListener('click',e=>{const g=e.target.closest('.card');pick(g?+g.dataset.c:null)});
const fine=matchMedia('(hover:hover) and (pointer:fine)');
plan.addEventListener('mouseover',e=>{if(!fine.matches||sel!=null)return;const g=e.target.closest('.card');const c=g?+g.dataset.c:null;if(c!==hov){hov=c;paint(c)}});
plan.addEventListener('mouseleave',()=>{if(sel==null&&hov!=null){hov=null;paint(null)}});
sh.addEventListener('click',e=>{if(e.target.closest('.x2'))return pick(null);const g=e.target.closest('[data-go]');if(!g)return;const c=+g.dataset.go;sel=null;pick(c);plan.querySelector(`.card[data-c="${c}"]`)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})});
const fitbtn=document.getElementById('fitbtn');
const ICON_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_IN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg>';
function setFit(on){document.documentElement.classList.toggle('fit',on);fitbtn.innerHTML=on?ICON_IN+'تكبير':ICON_OUT+'عرض كامل';try{localStorage.setItem('planFit',on?'1':'0')}catch(e){}}
let fitPref=null;try{fitPref=localStorage.getItem('planFit')}catch(e){}
setFit(fitPref==='1');
fitbtn.addEventListener('click',()=>setFit(!document.documentElement.classList.contains('fit')));
setTimeout(()=>hint.classList.add('gone'),7000);
window.addEventListener('beforeprint',()=>{sel=null;hov=null;render()});
</script>
</body>
