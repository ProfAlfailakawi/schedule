<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" direction="rtl" style="background:#f6f5f0; font-family:'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.03" />
    </filter>
    <filter id="float-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="#f6f5f0" />

  <!-- Right Dark Sidebar -->
  <rect x="1540" y="0" width="60" height="900" fill="#111815" />

  <!-- Sidebar Icons -->
  <g transform="translate(1556, 24)">
    <!-- Brand Pillar Icon -->
    <rect x="0" y="8" width="6" height="14" rx="3" fill="#2ea98c" />
    <rect x="10" y="0" width="6" height="22" rx="3" fill="#2ea98c" />
    <rect x="20" y="5" width="6" height="17" rx="3" fill="#2ea98c" />
  </g>

  <g transform="translate(1558, 86)" stroke="#7e8681" stroke-width="1.8" fill="none">
    <!-- Search -->
    <circle cx="12" cy="12" r="7" />
    <line x1="17" y1="17" x2="22" y2="22" stroke-linecap="round" />
  </g>

  <g transform="translate(1558, 144)" stroke="#7e8681" stroke-width="1.8" fill="none">
    <!-- Calendar -->
    <rect x="2" y="4" width="20" height="18" rx="3" />
    <line x1="2" y1="10" x2="22" y2="10" />
    <line x1="7" y1="1" x2="7" y2="5" stroke-linecap="round" />
    <line x1="17" y1="1" x2="17" y2="5" stroke-linecap="round" />
  </g>

  <g transform="translate(1558, 202)" stroke="#7e8681" stroke-width="1.8" fill="none">
    <!-- Document -->
    <path d="M4 2 H16 L20 6 V22 H4 Z" />
    <line x1="8" y1="10" x2="14" y2="10" stroke-linecap="round" />
    <line x1="8" y1="14" x2="16" y2="14" stroke-linecap="round" />
  </g>

  <g transform="translate(1558, 260)" stroke="#7e8681" stroke-width="1.8" fill="none">
    <!-- Sparkles / Wand -->
    <path d="M12 2 L14 7 L19 9 L14 11 L12 16 L10 11 L5 9 L10 7 Z" />
  </g>

  <!-- Sidebar Bottom Avatar -->
  <g transform="translate(1554, 836)">
    <circle cx="16" cy="16" r="16" fill="#232f2a" />
    <text x="16" y="21" fill="#d4a359" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ق</text>
  </g>

  <!-- ── Main Workspace Area (x: 20 to 1520) ──────────────────────────────── -->

  <!-- Top Metric Cards Row (y: 20, height: 86) -->
  <g id="top-cards" transform="translate(30, 20)">
    <!-- Outer container or 5 separated cards -->
    <rect x="0" y="0" width="1490" height="86" rx="14" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    
    <!-- Vertical dividers -->
    <line x1="298" y1="14" x2="298" y2="72" stroke="#f0eee8" stroke-width="1" />
    <line x1="596" y1="14" x2="596" y2="72" stroke="#f0eee8" stroke-width="1" />
    <line x1="894" y1="14" x2="894" y2="72" stroke="#f0eee8" stroke-width="1" />
    <line x1="1192" y1="14" x2="1192" y2="72" stroke="#f0eee8" stroke-width="1" />

    <!-- Card 1: 47 محاضرات اليوم (rightmost in RTL: 1192 to 1490) -->
    <text x="1440" y="46" fill="#121a17" font-size="34" font-weight="700" text-anchor="end">47</text>
    <text x="1440" y="68" fill="#717873" font-size="13" text-anchor="end">محاضرات اليوم</text>

    <!-- Card 2: 0 تعارضات حرجة (894 to 1192) -->
    <text x="1043" y="46" fill="#121a17" font-size="34" font-weight="700" text-anchor="middle">0</text>
    <text x="1043" y="68" fill="#717873" font-size="13" text-anchor="middle">تعارضات حرجة</text>

    <!-- Card 3: 8 قاعات مشغولة (596 to 894) -->
    <text x="745" y="46" fill="#121a17" font-size="34" font-weight="700" text-anchor="middle">8</text>
    <text x="745" y="68" fill="#717873" font-size="13" text-anchor="middle">قاعات مشغولة</text>

    <!-- Card 4: 1س 18د متوسط الفراغ (298 to 596) -->
    <text x="447" y="46" fill="#121a17" font-size="28" font-weight="700" text-anchor="middle">1س 18د</text>
    <text x="447" y="68" fill="#717873" font-size="13" text-anchor="middle">متوسط الفراغ</text>

    <!-- Card 5: 94% الجاهزية (0 to 298) -->
    <text x="50" y="46" fill="#121a17" font-size="34" font-weight="700" text-anchor="start">94%</text>
    <text x="50" y="68" fill="#717873" font-size="13" text-anchor="start">الجاهزية</text>
  </g>

  <!-- Attention Pill Row (y: 118, height: 42) -->
  <g id="attention-bar" transform="translate(30, 118)">
    <rect x="0" y="0" width="1490" height="42" rx="10" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <!-- Chevron on left -->
    <path d="M24 18 L30 24 L36 18" stroke="#717873" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Shield icon and text on right -->
    <g transform="translate(1446, 21)">
      <path d="M0 -8 L7 -5 V1 C7 6 0 9 0 9 C0 9 -7 6 -7 1 V-5 Z" fill="none" stroke="#b58135" stroke-width="1.5" />
    </g>
    <text x="1430" y="26" fill="#121a17" font-size="13" font-weight="600" text-anchor="end">يحتاج انتباهك: <tspan fill="#717873" font-weight="400">2 إضافية</tspan></text>
  </g>

  <!-- Histogram & Today Activity Card (y: 172, height: 215) -->
  <g id="histogram-card" transform="translate(30, 172)">
    <rect x="0" y="0" width="1490" height="215" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />

    <!-- Right Side: Big 47 + Badge -->
    <text x="1440" y="110" fill="#121a17" font-size="64" font-weight="700" text-anchor="end">47</text>
    <rect x="1320" y="92" width="92" height="28" rx="14" fill="#e6f5ef" />
    <text x="1366" y="110" fill="#1b6855" font-size="13" font-weight="600" text-anchor="middle">08:00 اليوم</text>

    <!-- Center: Gray Chart Track -->
    <rect x="260" y="32" width="1020" height="140" rx="14" fill="#f5f4ee" />

    <!-- Histogram Bars & Counts -->
    <!-- 08:00 (5) -->
    <rect x="1160" y="105" width="68" height="45" rx="4" fill="#27695d" />
    <text x="1194" y="164" fill="#525954" font-size="12" text-anchor="middle">5</text>
    <text x="1194" y="190" fill="#888f8a" font-size="12" text-anchor="middle">08</text>

    <!-- 09:00 (9) -->
    <rect x="1080" y="68" width="68" height="82" rx="4" fill="#27695d" />
    <text x="1114" y="164" fill="#525954" font-size="12" text-anchor="middle">9</text>

    <!-- 10:00 (9) -->
    <rect x="1000" y="68" width="68" height="82" rx="4" fill="#27695d" />
    <text x="1034" y="164" fill="#525954" font-size="12" text-anchor="middle">9</text>
    <text x="1034" y="190" fill="#888f8a" font-size="12" text-anchor="middle">11</text>

    <!-- 11:00 (3) -->
    <rect x="920" y="120" width="68" height="30" rx="4" fill="#27695d" />
    <text x="954" y="164" fill="#525954" font-size="12" text-anchor="middle">3</text>

    <!-- 12:00 (3) -->
    <rect x="840" y="120" width="68" height="30" rx="4" fill="#27695d" />
    <text x="874" y="164" fill="#525954" font-size="12" text-anchor="middle">3</text>

    <!-- 13:00 (5) -->
    <rect x="760" y="105" width="68" height="45" rx="4" fill="#27695d" />
    <text x="794" y="164" fill="#525954" font-size="12" text-anchor="middle">5</text>
    <text x="794" y="190" fill="#888f8a" font-size="12" text-anchor="middle">14</text>

    <!-- 14:00 (5) -->
    <rect x="680" y="105" width="68" height="45" rx="4" fill="#27695d" />
    <text x="714" y="164" fill="#525954" font-size="12" text-anchor="middle">5</text>

    <!-- 15:00 (4) -->
    <rect x="600" y="114" width="68" height="36" rx="4" fill="#27695d" />
    <text x="634" y="164" fill="#525954" font-size="12" text-anchor="middle">4</text>

    <!-- 16:00 (3) -->
    <rect x="520" y="123" width="68" height="27" rx="4" fill="#27695d" />
    <text x="554" y="164" fill="#525954" font-size="12" text-anchor="middle">3</text>

    <!-- 17:00 (1) -->
    <rect x="440" y="138" width="68" height="12" rx="4" fill="#27695d" />
    <text x="474" y="164" fill="#525954" font-size="12" text-anchor="middle">1</text>
    <text x="474" y="190" fill="#888f8a" font-size="12" text-anchor="middle">17</text>

    <!-- 18, 19, 20 (empty baseline) -->
    <line x1="290" y1="150" x2="430" y2="150" stroke="#d8d6cd" stroke-dasharray="4 4" stroke-width="2" />
    <text x="290" y="190" fill="#888f8a" font-size="12" text-anchor="middle">20</text>

    <!-- Left Controls: Button + Link -->
    <rect x="130" y="88" width="100" height="38" rx="10" fill="#23574c" />
    <text x="180" y="112" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">الجدول 📅</text>

    <text x="50" y="112" fill="#23574c" font-size="14" font-weight="600" text-anchor="start">التقارير ←</text>
  </g>

  <!-- Health Card: صحة الجدول (y: 400, height: 215) -->
  <g id="health-card" transform="translate(30, 400)">
    <rect x="0" y="0" width="1490" height="215" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />

    <!-- Card Title on right -->
    <g transform="translate(1440, 32)">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#23574c" stroke-width="1.8" />
      <path d="M-4 -0.5 L-1.5 2 L4 -3" stroke="#23574c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="-16" y="5" fill="#121a17" font-size="15" font-weight="700" text-anchor="end">صحة الجدول</text>
    </g>

    <!-- Progress Bars Container (x: 50 to 1420) -->
    <!-- Bar 1: جودة 94% (y: 65) -->
    <text x="1420" y="75" fill="#525954" font-size="13" text-anchor="end">جودة</text>
    <rect x="110" y="67" width="1260" height="9" rx="4.5" fill="#eceae3" />
    <rect x="110" y="67" width="1184" height="9" rx="4.5" fill="#23574c" />
    <text x="80" y="76" fill="#121a17" font-size="13" font-weight="700" text-anchor="start">94%</text>

    <!-- Bar 2: مرونة 46% (y: 105) -->
    <text x="1420" y="115" fill="#525954" font-size="13" text-anchor="end">مرونة</text>
    <rect x="110" y="107" width="1260" height="9" rx="4.5" fill="#eceae3" />
    <rect x="690" y="107" width="580" height="9" rx="4.5" fill="#23574c" />
    <text x="80" y="116" fill="#121a17" font-size="13" font-weight="700" text-anchor="start">46%</text>

    <!-- Bar 3: عدالة 73% (y: 145) -->
    <text x="1420" y="155" fill="#525954" font-size="13" text-anchor="end">عدالة</text>
    <rect x="110" y="147" width="1260" height="9" rx="4.5" fill="#eceae3" />
    <rect x="350" y="147" width="920" height="9" rx="4.5" fill="#23574c" />
    <text x="80" y="156" fill="#121a17" font-size="13" font-weight="700" text-anchor="start">73%</text>

    <!-- Bar 4: إشغال 89% (y: 185) -->
    <text x="1420" y="195" fill="#525954" font-size="13" text-anchor="end">إشغال</text>
    <rect x="110" y="187" width="1260" height="9" rx="4.5" fill="#eceae3" />
    <rect x="150" y="187" width="1120" height="9" rx="4.5" fill="#23574c" />
    <text x="80" y="196" fill="#121a17" font-size="13" font-weight="700" text-anchor="start">89%</text>
  </g>

  <!-- Bottom Row: 4 Metric Cards (y: 628, height: 180) -->
  <!-- Card 1: 109 مقرر (x: 1150) -->
  <g transform="translate(1150, 628)">
    <rect x="0" y="0" width="370" height="180" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <!-- Book Icon -->
    <g transform="translate(326, 32)" stroke="#717873" stroke-width="1.8" fill="none">
      <path d="M0 0 C4 -2, 10 -2, 14 0 V14 C10 12, 4 12, 0 14 Z" />
      <path d="M0 0 C-4 -2, -10 -2, -14 0 V14 C-10 12, -4 12, 0 14 Z" />
    </g>
    <text x="326" y="116" fill="#121a17" font-size="52" font-weight="700" text-anchor="end">109</text>
    <text x="326" y="148" fill="#717873" font-size="16" text-anchor="end">مقرر</text>
  </g>

  <!-- Card 2: 89 موعد (x: 775) -->
  <g transform="translate(775, 628)">
    <rect x="0" y="0" width="360" height="180" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <!-- Badge -->
    <rect x="32" y="24" width="52" height="22" rx="11" fill="#e8f4ef" />
    <text x="58" y="39" fill="#22705b" font-size="12" font-weight="700" text-anchor="middle">▲ 79</text>
    <!-- Calendar Icon -->
    <g transform="translate(320, 24)" stroke="#717873" stroke-width="1.8" fill="none">
      <rect x="-10" y="0" width="18" height="16" rx="2" />
      <line x1="-10" y1="5" x2="8" y2="5" />
    </g>
    <text x="320" y="116" fill="#121a17" font-size="52" font-weight="700" text-anchor="end">89</text>
    <text x="320" y="148" fill="#717873" font-size="16" text-anchor="end">موعد</text>
    <!-- Chevron -->
    <path d="M170 162 L180 168 L190 162" stroke="#23574c" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Card 3: 34 أستاذ (x: 400) -->
  <g transform="translate(400, 628)">
    <rect x="0" y="0" width="360" height="180" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <!-- Badge -->
    <rect x="32" y="24" width="52" height="22" rx="11" fill="#e8f4ef" />
    <text x="58" y="39" fill="#22705b" font-size="12" font-weight="700" text-anchor="middle">▲ 28</text>
    <!-- People Icon -->
    <g transform="translate(320, 24)" stroke="#717873" stroke-width="1.8" fill="none">
      <circle cx="-2" cy="4" r="4" />
      <path d="M-8 16 C-8 12, -4 10, -2 10 C0 10, 4 12, 4 16" />
    </g>
    <text x="320" y="116" fill="#121a17" font-size="52" font-weight="700" text-anchor="end">34</text>
    <text x="320" y="148" fill="#717873" font-size="16" text-anchor="end">أستاذ</text>
    <!-- Chevron -->
    <path d="M170 162 L180 168 L190 162" stroke="#b58135" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Card 4: 9 قاعة (x: 30) -->
  <g transform="translate(30, 628)">
    <rect x="0" y="0" width="355" height="180" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <!-- Badge -->
    <rect x="32" y="24" width="46" height="22" rx="11" fill="#e8f4ef" />
    <text x="55" y="39" fill="#22705b" font-size="12" font-weight="700" text-anchor="middle">▲ 6</text>
    <!-- Door Icon -->
    <g transform="translate(315, 24)" stroke="#717873" stroke-width="1.8" fill="none">
      <rect x="-8" y="-2" width="14" height="20" rx="2" />
      <circle cx="-4" cy="8" r="1" fill="#717873" />
    </g>
    <text x="315" y="116" fill="#121a17" font-size="52" font-weight="700" text-anchor="end">9</text>
    <text x="315" y="148" fill="#717873" font-size="16" text-anchor="end">قاعة</text>
    <!-- Chevron -->
    <path d="M170 162 L180 168 L190 162" stroke="#b58135" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Bottom Timeline Center Pill Note -->
  <g transform="translate(540, 836)">
    <rect x="0" y="0" width="440" height="32" rx="16" fill="#ffffff" stroke="#ebe9e2" filter="url(#card-shadow)" />
    <text x="220" y="21" fill="#525954" font-size="12" text-anchor="middle">
      الخط يغطي الفصل الصيفي 2024/2025 ← الفصل الأول 2026/2027 <tspan fill="#121a17" font-weight="700">4 فصول</tspan>
    </text>
  </g>

  <!-- Floating Assistant Capsule (Bottom Left: x: 40, y: 830) -->
  <g transform="translate(40, 826)" filter="url(#float-shadow)">
    <rect x="0" y="0" width="150" height="48" rx="24" fill="#ffffff" stroke="#ebe9e2" />
    <!-- Sparkle Circle Button -->
    <circle cx="122" cy="24" r="16" fill="#23574c" />
    <path d="M122 18 L123 22 L127 24 L123 26 L122 30 L121 26 L117 24 L121 22 Z" fill="#ffffff" />
    <!-- Text -->
    <text x="70" y="22" fill="#717873" font-size="11" text-anchor="middle">مرشد حي</text>
    <text x="70" y="36" fill="#121a17" font-size="14" font-weight="700" text-anchor="middle">كيف؟</text>
  </g>
</svg>